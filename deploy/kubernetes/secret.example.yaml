apiVersion: v1
kind: Secret
metadata:
  name: layer8-secrets
  namespace: layer8
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://proxy_user:change-me@postgres.layer8.svc.cluster.local:5432/ai_proxy
  REDIS_URL: redis://redis.layer8.svc.cluster.local:6379/0
  S3_BUCKET: ai-proxy-audit
  S3_ENDPOINT_URL: https://minio.example.internal
  AWS_ENDPOINT_URL: https://elasticmq.example.internal
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
  AUDIT_QUEUE_URL: https://elasticmq.example.internal/queue/ai-proxy-audit
  OPENAI_API_KEY: change-me
