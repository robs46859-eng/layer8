services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_proxy
      POSTGRES_USER: proxy_user
      POSTGRES_PASSWORD: proxy_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_user -d ai_proxy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testtesttest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  minio_data:
  localstack_data:
