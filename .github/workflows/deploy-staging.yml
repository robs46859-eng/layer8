name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      NAMESPACE: layer8-staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply staging secret manifest
        env:
          K8S_SECRET_MANIFEST: ${{ secrets.K8S_SECRET_MANIFEST }}
        run: |
          if [ -n "${K8S_SECRET_MANIFEST}" ]; then
            printf '%s\n' "${K8S_SECRET_MANIFEST}" | kubectl apply -f -
          else
            echo "K8S_SECRET_MANIFEST is not configured for the staging environment."
            exit 1
          fi

      - name: Apply staging overlay
        run: |
          kubectl apply -k deploy/kubernetes/overlays/staging

      - name: Update staging image
        run: |
          kubectl -n "${NAMESPACE}" set image deployment/layer8-api api="${IMAGE}"
          kubectl -n "${NAMESPACE}" set image deployment/layer8-worker worker="${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl -n "${NAMESPACE}" rollout status deployment/layer8-api --timeout=180s
          kubectl -n "${NAMESPACE}" rollout status deployment/layer8-worker --timeout=180s
