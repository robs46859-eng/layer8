name: Deploy Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example v0.1.0"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      NAMESPACE: layer8-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply production secret manifest
        env:
          K8S_SECRET_MANIFEST: ${{ secrets.K8S_SECRET_MANIFEST }}
        run: |
          if [ -n "${K8S_SECRET_MANIFEST}" ]; then
            printf '%s\n' "${K8S_SECRET_MANIFEST}" | kubectl apply -f -
          else
            echo "K8S_SECRET_MANIFEST is not configured for the production environment."
            exit 1
          fi

      - name: Apply production overlay
        run: |
          kubectl apply -k deploy/kubernetes/overlays/production

      - name: Update production image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
        run: |
          kubectl -n "${NAMESPACE}" set image deployment/layer8-api api="${IMAGE}"
          kubectl -n "${NAMESPACE}" set image deployment/layer8-worker worker="${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl -n "${NAMESPACE}" rollout status deployment/layer8-api --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/layer8-worker --timeout=300s
