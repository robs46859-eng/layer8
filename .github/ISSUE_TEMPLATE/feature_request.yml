name: Feature request
description: Propose a new capability or hardening improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap are you trying to close?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the system do?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Security, latency, cost, tenancy, or operational constraints.
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How will we know this is complete?
