name: Bug report
description: Report a defect in the API, worker, or deployment flow.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Describe the failure clearly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps, inputs, and environment details.
      placeholder: |
        1. Start stack with ...
        2. Call endpoint ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and traces
      description: Include request IDs, stack traces, or relevant container logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - API
        - Worker
        - Database migration
        - Cache
        - Queue
        - Deployment
    validations:
      required: true
